{{- if include "nzbfast.renderSettings" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-settings-json" (include "nzbfast.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nzbfast.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.json: |
    {{- include "nzbfast.settingsJson" . | nindent 4 }}
{{- end }}
