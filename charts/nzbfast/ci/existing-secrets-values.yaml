# Both files come from Secrets managed outside the chart (SOPS, ESO,
# sealed-secrets). The chart renders neither, and only places them.
config:
  mode: enforce
  existingSecret: nzbfast-config
  existingSecretKey: config.json

settings:
  mode: seed
  existingSecret: nzbfast-settings
  existingSecretKey: settings.json

apiKey:
  existingSecret: nzbfast-apikey
  existingSecretKey: apikey

persistence:
  config:
    existingClaim: nzbfast-config-pvc
  downloads:
    existingClaim: media-downloads
