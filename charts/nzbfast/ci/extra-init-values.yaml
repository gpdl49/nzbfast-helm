# An extra init container running before the chart's own, plus a shared media
# mount — the shape a multi-app media namespace needs.
extraInitContainers:
  - name: fix-media-permissions
    image: busybox:latest
    command: [/bin/sh, -c]
    args:
      - |
        mkdir -p /media/library
        chown root:65534 /media /media/library
        chmod 2775 /media /media/library
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    volumeMounts:
      - name: media
        mountPath: /media/

extraVolumes:
  - name: media
    persistentVolumeClaim:
      claimName: shared-media

extraVolumeMounts:
  - name: media
    mountPath: /media/

settings:
  mode: merge
  values:
    move_completed: /media/downloads/complete
    move_completed_cats: "vr=/media/library/xbvr"
    categories: "whisparr, vr"
