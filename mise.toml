# CLIs pinned to match .github/workflows/{pr-validate,publish}.yaml
min_version = "2024.11.0"

[tools]
helm = "3.16.4"
hk = "2.11.1"
jactionlint = "2.5.0"
kubeconform = "0.6.7"
yamllint = "1.38.0"
yq = "4.44.3"

[tasks.setup]
description = "Install pinned tools and hk Git hooks"
run = "mise install && hk install --mise"
